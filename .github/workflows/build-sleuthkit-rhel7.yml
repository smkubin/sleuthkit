name: Build Sleuth Kit 4.15.0 for RHEL 7 with VHD support

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TSK_VERSION: "4.15.0"
  TSK_TAG: "sleuthkit-4.15.0"
  LIBBFIO_VERSION: "20260623"
  LIBVHDI_VERSION: "20251119"
  ARTIFACT: "sleuthkit-4.15.0-vhd-rhel7-x86_64"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist work

          cat > work/Dockerfile <<'EOF'
          # syntax=docker/dockerfile:1.6
          FROM quay.io/centos/centos:7

          SHELL ["/bin/bash", "-o", "pipefail", "-c"]

          ARG TSK_VERSION
          ARG TSK_TAG
          ARG LIBBFIO_VERSION
          ARG LIBVHDI_VERSION
          ARG ARTIFACT

          ENV PREFIX="/opt/sleuthkit-${TSK_VERSION}"

          RUN <<'BASH'
          set -eux

          cat > /etc/yum.repos.d/CentOS-Base.repo <<'REPO'
          [base]
          name=CentOS 7.9.2009 - Base
          baseurl=https://vault.centos.org/7.9.2009/os/$basearch/
          enabled=1
          gpgcheck=0

          [updates]
          name=CentOS 7.9.2009 - Updates
          baseurl=https://vault.centos.org/7.9.2009/updates/$basearch/
          enabled=1
          gpgcheck=0

          [extras]
          name=CentOS 7.9.2009 - Extras
          baseurl=https://vault.centos.org/7.9.2009/extras/$basearch/
          enabled=1
          gpgcheck=0
          REPO

          cat > /etc/yum.repos.d/CentOS-SCLo.repo <<'REPO'
          [centos-sclo-rh]
          name=CentOS 7.9.2009 - SCLo rh
          baseurl=https://vault.centos.org/7.9.2009/sclo/$basearch/rh/
          enabled=1
          gpgcheck=0

          [centos-sclo-sclo]
          name=CentOS 7.9.2009 - SCLo sclo
          baseurl=https://vault.centos.org/7.9.2009/sclo/$basearch/sclo/
          enabled=1
          gpgcheck=0
          REPO

          yum -y install \
            ca-certificates \
            curl \
            git \
            make \
            perl \
            which \
            file \
            findutils \
            tar \
            gzip \
            binutils \
            autoconf \
            automake \
            libtool \
            pkgconfig \
            zlib-devel \
            fuse-devel \
            gettext-devel

          yum -y install devtoolset-11-gcc-c++ \
            || yum -y install devtoolset-10-gcc-c++ \
            || yum -y install devtoolset-9-gcc-c++ \
            || yum -y install devtoolset-8-gcc-c++

          yum clean all
          BASH

          WORKDIR /build

          RUN <<'BASH'
          set -eux

          DTS="$(ls -d /opt/rh/devtoolset-* | sort -V | tail -1)"
          source "${DTS}/enable"

          export PATH="${PREFIX}/bin:${PATH}"
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="${PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export CPPFLAGS="-I${PREFIX}/include"
          export CFLAGS="-O2 -pipe"
          export CXXFLAGS="-O2 -pipe"
          export LDFLAGS="-L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib -static-libstdc++ -static-libgcc"
          export LD_RUN_PATH="${PREFIX}/lib"

          mkdir -p "${PREFIX}" /build/src
          cd /build/src

          curl -fL \
            "https://github.com/libyal/libbfio/releases/download/${LIBBFIO_VERSION}/libbfio-alpha-${LIBBFIO_VERSION}.tar.gz" \
            -o libbfio.tar.gz

          tar -tzf libbfio.tar.gz > libbfio.contents
          LIBBFIO_SRCDIR="$(awk -F/ 'NF > 1 && $1 != "." { print $1; exit }' libbfio.contents)"
          test -n "${LIBBFIO_SRCDIR}"

          tar -xzf libbfio.tar.gz
          cd "${LIBBFIO_SRCDIR}"

          ./configure \
            --prefix="${PREFIX}" \
            --enable-shared \
            --enable-static \
            --disable-python

          make -j"$(nproc)"
          make install

          cd /build/src

          curl -fL \
            "https://github.com/libyal/libvhdi/releases/download/${LIBVHDI_VERSION}/libvhdi-alpha-${LIBVHDI_VERSION}.tar.gz" \
            -o libvhdi.tar.gz

          tar -tzf libvhdi.tar.gz > libvhdi.contents
          LIBVHDI_SRCDIR="$(awk -F/ 'NF > 1 && $1 != "." { print $1; exit }' libvhdi.contents)"
          test -n "${LIBVHDI_SRCDIR}"

          tar -xzf libvhdi.tar.gz
          cd "${LIBVHDI_SRCDIR}"

          ./configure \
            --prefix="${PREFIX}" \
            --with-libbfio="${PREFIX}" \
            --enable-shared \
            --enable-static \
            --enable-tools \
            --disable-python

          make -j"$(nproc)"
          make install

          echo "${PREFIX}/lib" > /etc/ld.so.conf.d/sleuthkit.conf
          ldconfig
          BASH

          RUN git clone --depth 1 --branch "${TSK_TAG}" \
            https://github.com/sleuthkit/sleuthkit.git /build/sleuthkit

          RUN <<'BASH'
          set -eux

          DTS="$(ls -d /opt/rh/devtoolset-* | sort -V | tail -1)"
          source "${DTS}/enable"

          export PATH="${PREFIX}/bin:${PATH}"
          export PKG_CONFIG_PATH="${PREFIX}/lib/pkgconfig:${PREFIX}/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          export LD_LIBRARY_PATH="${PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          export CPPFLAGS="-I${PREFIX}/include"
          export CFLAGS="-O2 -pipe"
          export CXXFLAGS="-O2 -pipe"
          export LDFLAGS="-L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib -static-libstdc++ -static-libgcc"
          export LD_RUN_PATH="${PREFIX}/lib"

          cd /build/sleuthkit

          ./bootstrap

          ./configure \
            --prefix="${PREFIX}" \
            --disable-java \
            --disable-cppunit \
            --without-afflib \
            --without-ewf \
            --with-libbfio="${PREFIX}" \
            --with-libvhdi="${PREFIX}" \
            --without-libvmdk \
            --without-libvslvm

          make -j"$(nproc)"
          make install

          strip "${PREFIX}"/bin/* || true
          find "${PREFIX}" -type f -name '*.so*' -exec strip --strip-unneeded {} + || true

          cat > "${PREFIX}/env.sh" <<ENV
          export PATH=${PREFIX}/bin:\$PATH
          export LD_LIBRARY_PATH=${PREFIX}/lib:\$LD_LIBRARY_PATH
          ENV

          cat > "${PREFIX}/README.txt" <<README
          Sleuth Kit ${TSK_VERSION} for RHEL 7.x x86_64 with VHD support.

          Use on RHEL 7.9:

            sudo tar -C / -xzf ${ARTIFACT}.tar.gz
            source ${PREFIX}/env.sh

          Basic checks:

            fls -V
            img_stat -V
            vhdiinfo -V

          VHD examples:

            vhdiinfo disk.vhd
            img_stat -i vhdi disk.vhd
            mmls -i vhdi disk.vhd
            fsstat -i vhdi -o <START_SECTOR> disk.vhd
            fls -i vhdi -o <START_SECTOR> disk.vhd

          For vhdimount, install fuse and fuse-libs from the RHEL 7.9 DVD if missing.
          README

          tar -C / -czf "/${ARTIFACT}.tar.gz" "opt/sleuthkit-${TSK_VERSION}"
          BASH
          EOF

          DOCKER_BUILDKIT=1 docker build \
            --build-arg TSK_VERSION="${TSK_VERSION}" \
            --build-arg TSK_TAG="${TSK_TAG}" \
            --build-arg LIBBFIO_VERSION="${LIBBFIO_VERSION}" \
            --build-arg LIBVHDI_VERSION="${LIBVHDI_VERSION}" \
            --build-arg ARTIFACT="${ARTIFACT}" \
            -t "${ARTIFACT}:build" \
            work

          cid="$(docker create "${ARTIFACT}:build")"
          docker cp "${cid}:/${ARTIFACT}.tar.gz" "dist/${ARTIFACT}.tar.gz"
          docker rm "${cid}"

          sha256sum "dist/${ARTIFACT}.tar.gz" > "dist/${ARTIFACT}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/*
          if-no-files-found: error
